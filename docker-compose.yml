services:
# database setup
  postgres:
    image: postgres:18
    environment:
      # database credentials -- will need to update
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: calendar_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  # MongoDB: the worker's raw extraction staging (arch-initial.md §6; A4, D3). Local only; Atlas is H3's.
  # No auth, and published on localhost only: this is a dev database that holds scraped page text.
  mongo:
    image: mongo:8
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodata:/data/db

volumes:
  pgdata:
  mongodata: