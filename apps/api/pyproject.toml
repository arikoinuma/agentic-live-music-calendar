[project]
name = "api"
version = "0.1.0"
description = "Agentic Liver Music Calendar API application"
readme = "README.md"
authors = [
    { name = "Ari Koinuma", email = "764489+arikoinuma@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "fastmcp>=3.4.7",
    "pydantic-settings>=2.15.0",
    "resend>=2.36.0",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.0.52",
    "structlog>=26.1.0",
    "tzdata>=2026.3",
    "uvicorn[standard]>=0.52.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "polyfactory>=3.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]
