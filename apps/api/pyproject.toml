[project]
name = "api"
version = "0.1.0"
description = "Agentic Live Music Calendar API application"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
authors = [
    { name = "Ari Koinuma", email = "764489+arikoinuma@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "boto3>=1.43.78",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "instructor>=1.15.4",
    "langgraph>=1.2.11",
    "openai>=2.54.0",
    "playwright>=1.62.0",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.17.0",
    "resend>=2.36.0",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.0.52",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "tzdata>=2026.3",
    "uvicorn[standard]>=0.52.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "mypy>=2.3.0",
    "polyfactory>=3.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.mypy]
# pydantic-settings' BaseSettings populates required fields from env/.env
# at runtime, not from constructor args — without this plugin mypy treats
# `database_url`/`model_name` as missing arguments to Settings().
plugins = ["pydantic.mypy"]
# What a bare `uv run mypy` checks, so the Makefile, CI and a person at a prompt all check the same
# thing. Both packages are held to one bar: the worker, its tests and the eval harness included
# (v0.1-G15; A7-D3). Bodies of unannotated functions are not checked (no check_untyped_defs), so
# annotate a function to put its body under the gate. migrations/ and most of scripts/ are outside it; the exceptions are
# scripts/rehearse_migration.py, scripts/restore_neon_role.py and the tests in scripts/tests, which are typed.
files = ["app", "agent_worker", "scripts/rehearse_migration.py", "scripts/restore_neon_role.py", "scripts/tests"]

[tool.pytest.ini_options]
# Both packages are walked in full, so a test placed anywhere under app/ or agent_worker/ is
# collected (v0.1-G14: a test outside the listed directories used to be silently never run).
# What keeps that safe is python_files: pytest's default also matches *_test.py, which matches
# agent_worker/local_test.py, a manual script that opens real databases and expects a real model.
# pytest imports every file matching these globs, tests or not, so the script would be imported on
# every run. Only test_*.py is a test module; name a manual script anything else. The tests for
# agent_worker/ can't live in app/tests/ (app/ never imports from agent_worker/).
# app/tests/test_pytest_config.py guards both settings (A7).
testpaths = ["app", "agent_worker", "scripts"]
# apps/api on the path, so a test under scripts/ can `from scripts.rehearse_migration import ...` the way app/ tests import `app`.
pythonpath = ["."]
python_files = ["test_*.py"]
# pytest-asyncio 1.x defaults to a fresh event loop per test, but asyncpg
# connections are bound to the loop that created them — so the session-scoped
# DB fixtures (app/testing/db.py) and the tests that use them must share one
# loop. Leaving the fixture scope unset also raises a deprecation warning.
# -rs: print skip reasons, so a skipped DB suite is visible rather than silent.
addopts = "-rs"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
# Report-only (`make coverage`; A7-D1). Branch coverage, because a line that runs can still have a branch that never
# does (a guard clause is one line, taken one way). Tests are the measuring stick, not the thing measured; model_eval/ is
# the experiment harness and local_test.py a manual script, neither run by the suite.
branch = true
source = ["app", "agent_worker"]
omit = ["*/tests/*", "agent_worker/model_eval/*", "agent_worker/local_test.py"]

[tool.coverage.report]
# Read the "Missing" column, not the percentage: there is deliberately no threshold or CI gate, because a percentage
# gate invites tests that touch lines instead of proving behavior (the point of the `Proves:` convention).
show_missing = true
skip_empty = true

[tool.ruff]
# The width the code is already written at. Without a setting ruff assumes 88, which would rewrap most of the
# codebase; `ruff format` enforces this, and `make lint` and CI check it (PQR1-1).
line-length = 120

[tool.ruff.lint]
# A broader rule set than ruff's default (E4, E7, E9, F), chosen from PQR1-7: pyflakes and pycodestyle (F, E, W),  # designation-ok: ruff rule codes
# import order (I), likely bugs (B), modern syntax (UP), simplifications (SIM, C4, RET), ruff's own rules (RUF), naming
# (N), async pitfalls (ASYNC), naive datetimes (DTZ) and bandit's security checks (S).
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RET", "RUF", "N", "ASYNC", "DTZ", "S"]
ignore = [
    # The formatter owns line length for code. What it can't break is a long comment, string or URL, and this
    # codebase's long why-comments are deliberate (AGENTS.md, Conventions).
    "E501",  # designation-ok: a ruff rule code
    # The prose deliberately uses typographic characters (an en dash, a multiplication sign, an arrow) in strings,
    # docstrings and comments. These rules read them as look-alikes of ASCII.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert (S101), and use throwaway passwords, temp paths and subprocess calls on fixed arguments (S105, S108,  (designation-ok: ruff rule codes)
# S603); a test that writes a tiny fixture file in an async test is fine (ASYNC240).  (designation-ok: ruff rule codes)
"**/tests/**" = ["S101", "S105", "S108", "S603", "ASYNC240"]  # designation-ok: ruff rule codes
"**/conftest.py" = ["S101"]  # designation-ok: ruff rule codes
# Test support and developer tools, not the scheduled path: their asserts check a fixture or a local run.
"app/testing/**" = ["S101"]  # designation-ok: ruff rule codes
"agent_worker/model_eval/**" = ["S101"]  # designation-ok: ruff rule codes
"agent_worker/local_test.py" = ["S101"]  # designation-ok: ruff rule codes
# Kept for now, narrowed to the files they fire in, because each is its own review finding: the exception names
# without an `Error` suffix are PQR1-17 and the single-letter `l` is PQR1-18. Remove these lines when those land.
"agent_worker/calendar_writer.py" = ["N818"]
"agent_worker/nodes.py" = ["N818"]
"agent_worker/sources/embedded_events.py" = ["N818"]
"agent_worker/model_eval/labeled_page_runs/two_run_scenarios.py" = ["N818"]
"agent_worker/reconcile.py" = ["E741"]  # designation-ok: ruff rule codes
"agent_worker/tests/test_reconcile_removal.py" = ["E741"]  # designation-ok: ruff rule codes
# Broad except is deliberate here: one fixture/model failing outright
# shouldn't stop the eval loop, and the failure itself is a result worth
# recording. See the comment above the try/except in run_eval.py.
"agent_worker/model_eval/run_eval.py" = ["BLE001"]
