[project]
name = "api"
version = "0.1.0"
description = "Agentic Live Music Calendar API application"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
authors = [
    { name = "Ari Koinuma", email = "764489+arikoinuma@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "boto3>=1.43.78",
    "fastapi>=0.141.1",
    "fastmcp>=3.4.7",
    "httpx>=0.28.1",
    "instructor>=1.15.4",
    "langgraph>=1.2.11",
    "openai>=2.54.0",
    "playwright>=1.62.0",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.17.0",
    "resend>=2.36.0",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.0.52",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "tzdata>=2026.3",
    "uvicorn[standard]>=0.52.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "polyfactory>=3.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.mypy]
# pydantic-settings' BaseSettings populates required fields from env/.env
# at runtime, not from constructor args — without this plugin mypy treats
# `database_url`/`model_name` as missing arguments to Settings().
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
# Both packages are walked in full, so a test placed anywhere under app/ or agent_worker/ is
# collected (v0.1-G14: a test outside the listed directories used to be silently never run).
# What keeps that safe is python_files: pytest's default also matches *_test.py, which matches
# agent_worker/local_test.py, a manual script that opens real databases and expects a real model.
# pytest imports every file matching these globs, tests or not, so the script would be imported on
# every run. Only test_*.py is a test module; name a manual script anything else. The tests for
# agent_worker/ can't live in app/tests/ (app/ never imports from agent_worker/).
# app/tests/test_pytest_config.py guards both settings (A7).
testpaths = ["app", "agent_worker"]
python_files = ["test_*.py"]
# pytest-asyncio 1.x defaults to a fresh event loop per test, but asyncpg
# connections are bound to the loop that created them — so the session-scoped
# DB fixtures (app/testing/db.py) and the tests that use them must share one
# loop. Leaving the fixture scope unset also raises a deprecation warning.
# -rs: print skip reasons, so a skipped DB suite is visible rather than silent.
addopts = "-rs"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff.lint.per-file-ignores]
# Broad except is deliberate here: one fixture/model failing outright
# shouldn't stop the eval loop, and the failure itself is a result worth
# recording. See the comment above the try/except in run_eval.py.
"agent_worker/eval/run_eval.py" = ["BLE001"]
