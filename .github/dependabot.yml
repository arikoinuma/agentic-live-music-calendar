# Dependabot: opens a PR when a dependency has a newer version, and a separate
# PR when a security advisory affects one we use. Free on public repos.
#
# Why these ecosystems: the repo has three dependency surfaces that CI installs
# from lockfiles (apps/api/uv.lock, pnpm-lock.yaml, and the actions pinned in
# .github/workflows). Each gets its own entry so a noisy group can't hide a
# security bump in another.
#
# Schedule is weekly, not daily: a daily feed of version bumps would be more
# to review than this project needs.

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # @types/node tracks the Node runtime we run, not the newest release: CI and local
      # dev use Node 24 (.github/workflows/ci.yml). Types for a newer major accept APIs
      # that don't exist at runtime, and the type-check can't catch that. Move this
      # pin together with the CI node-version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
