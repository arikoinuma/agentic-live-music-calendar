name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token for every job. Without this, the default GITHUB_TOKEN
# permissions depend on the repo's settings, and a public repo can receive
# PRs from forks. Nothing in CI writes back to GitHub, so read is all it needs.
permissions:
  contents: read

jobs:
  python:
    name: Python (apps/api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # A real Postgres for the DB tests (app/tests/test_db_schema.py,
    # test_seed.py): they run the Alembic migration, round-trip its
    # downgrade, and exercise constraints. The fixtures drop and recreate
    # `calendar_test` themselves, so the service only has to accept
    # connections. `ports` is required because this job runs on the runner
    # host, not inside a container.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # A4: the one real-MongoDB test (agent_worker/tests/test_staging_mongo.py) runs here. It skips
      # where no server answers, but fails under CI, so a missing service can't pass silently.
      mongo:
        # Pinned to 7.0 to match docker-compose.yml: MongoDB 8.x won't start on Linux kernel 6.19+ (see docs/dev/notes.md).
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # DATABASE_URL only has to make Settings() resolve at import time; the
      # tests never write to it. They use calendar_test, via the variable
      # below. Live model extraction still isn't exercised here.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ci
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/calendar_test
      MODEL_NAME: ci-placeholder
      MONGODB_TEST_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - run: uv python install 3.13

      - run: uv sync --locked

      - name: ruff
        run: uv run ruff check .

      - name: mypy
        # No path: [tool.mypy] files in pyproject.toml names what is checked, app/ and
        # agent_worker/ (tests and eval harness included), so CI and `make typecheck` can't
        # disagree. Widened from app/ alone in A7 (v0.1-G15).
        run: uv run mypy

      - name: pytest
        run: uv run pytest

  js:
    name: JS (turbo lint + check-types + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run lint check-types test

  contract:
    name: Contract (schemas.py -> TypeScript)
    runs-on: ubuntu-latest
    env:
      # Needed because dump_openapi imports app.main, which constructs
      # Settings at import time. Nothing here connects to anything.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ci
      MODEL_NAME: ci-placeholder
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - run: uv python install 3.13

      - run: uv sync --locked
        working-directory: apps/api

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Regenerates lib/api-types.ts and lib/fixtures/ from the Pydantic
      # models, then fails if the result differs from what's committed.
      # This is what makes generated types worth the build step: a
      # backend shape change that nobody regenerated for becomes a red
      # PR instead of an `undefined` in production.
      - name: Check generated contract output is current
        run: make contract-check

  e2e:
    name: E2E (Playwright, real API on Postgres)
    runs-on: ubuntu-latest
    # The suite takes about two minutes; a hang outside Playwright's own timeouts (an install, a
    # server that never answers) would otherwise hold the runner for the 6-hour default.
    timeout-minutes: 20
    # B6 (docs/dev/implementations/b6-accessibility-and-e2e.md, B6-D1 and B6-D4), moved onto a database
    # by C2 (docs/dev/implementations/c2-api-reads-database.md, C2-D7). Playwright starts the whole stack
    # itself (apps/calendar/playwright.config.ts): it rebuilds a throwaway `calendar_e2e` database on this
    # service and loads the sample world into it, then starts the real FastAPI app on a frozen clock, a
    # pass-through proxy and `next start` on a production build. A separate job from `js` so a JS-only
    # change still gets fast feedback, and so Python and a browser are installed only here.
    services:
      # The same image and credentials as the python job. The harness drops and creates the database
      # itself, so the service only has to accept connections.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - run: uv python install 3.13

      - run: uv sync --locked
        working-directory: apps/api

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The browser is the slow download, so cache it per Playwright version. `install
      # --with-deps` still runs on a cache hit: it skips the download but installs the
      # system libraries Chromium needs, which the runner image doesn't keep between jobs.
      - name: Playwright version (the browser cache key)
        id: playwright
        run: echo "version=$(pnpm --filter calendar exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - run: pnpm --filter calendar exec playwright install --with-deps chromium

      # The build's API_BASE_URL only has to exist: every route is dynamic, so nothing is
      # fetched at build time (apps/calendar/AGENTS.md).
      - run: pnpm --filter calendar build
        env:
          API_BASE_URL: http://127.0.0.1:8102

      - run: pnpm --filter calendar exec playwright test

      # The HTML report and the failure traces, only when something failed.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/calendar/playwright-report/
            apps/calendar/test-results/
          retention-days: 7

  designations:
    name: Designations (scoped IDs)
    # Pull requests only: it looks at the lines a PR adds. A push to main has no base to compare with.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so the merge-base with the PR's target branch can be found.
          fetch-depth: 0

      # A designation (a decision, key point or review item number) means something different in every plan, so
      # outside the plan that defines it, it must carry its scope (A5-D7). docs/dev/conventions.md has the forms; `make designation-check` runs the
      # same check locally. Fails if this PR adds a bare one to code, tests, comments or another document.
      - name: No bare designations outside their plan
        env:
          BASE_REF: ${{ github.base_ref }}
        run: make designation-check BASE="$(git merge-base "origin/$BASE_REF" HEAD)"
