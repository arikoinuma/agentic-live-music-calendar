name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    name: Python (apps/api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # A real Postgres for the DB tests (app/tests/test_db_schema.py,
    # test_seed.py): they run the Alembic migration, round-trip its
    # downgrade, and exercise constraints. The fixtures drop and recreate
    # `calendar_test` themselves, so the service only has to accept
    # connections. `ports` is required because this job runs on the runner
    # host, not inside a container.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # A4: the one real-MongoDB test (agent_worker/tests/test_staging_mongo.py) runs here. It skips
      # where no server answers, but fails under CI, so a missing service can't pass silently.
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
    env:
      # DATABASE_URL only has to make Settings() resolve at import time; the
      # tests never write to it. They use calendar_test, via the variable
      # below. Live model extraction still isn't exercised here.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ci
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/calendar_test
      MODEL_NAME: ci-placeholder
      MONGODB_TEST_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - run: uv python install 3.13

      - run: uv sync --locked

      - name: ruff
        run: uv run ruff check .

      - name: mypy
        # Scoped to app/ — agent_worker/ (Phase 6) is still active WIP with
        # known type errors; widen this once that settles.
        run: uv run mypy app/

      - name: pytest
        run: uv run pytest

  js:
    name: JS (turbo lint + check-types + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run lint check-types test

  contract:
    name: Contract (schemas.py -> TypeScript)
    runs-on: ubuntu-latest
    env:
      # Needed because dump_openapi imports app.main, which constructs
      # Settings at import time. Nothing here connects to anything.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ci
      MODEL_NAME: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - run: uv python install 3.13

      - run: uv sync --locked
        working-directory: apps/api

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Regenerates lib/api-types.ts and lib/fixtures/ from the Pydantic
      # models, then fails if the result differs from what's committed.
      # This is what makes generated types worth the build step: a
      # backend shape change that nobody regenerated for becomes a red
      # PR instead of an `undefined` in production.
      - name: Check generated contract output is current
        run: make contract-check
